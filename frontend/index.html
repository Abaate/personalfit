<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>FitPro — Gestão de Treinos & Evolução</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Space Grotesk"', 'sans-serif'],
                        body: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        ink: {
                            950: '#0a0e14',
                            900: '#11161f',
                            800: '#1a212c',
                            700: '#252e3b',
                            600: '#3a4553',
                        },
                        lime: {
                            400: '#c8f169',
                            500: '#b0e83f',
                            600: '#93cb28',
                        },
                        coral: {
                            400: '#ff8a65',
                            500: '#ff6b4a',
                        }
                    },
                    boxShadow: {
                        'glow': '0 0 0 1px rgba(200,241,105,0.15), 0 8px 30px -8px rgba(200,241,105,0.25)',
                    }
                }
            }
        }
    </script>
    <!-- React, ReactDOM, Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            background-color: #0a0e14;
            background-image:
                radial-gradient(circle at 15% 0%, rgba(200,241,105,0.06), transparent 40%),
                radial-gradient(circle at 85% 15%, rgba(255,107,74,0.05), transparent 35%);
            color: #e7ebf1;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3a4553; border-radius: 8px; }

        img.demo-media, video.demo-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: auto;
            display: block;
            transition: transform .4s cubic-bezier(.2,.8,.2,1);
        }
        .demo-frame:hover img.demo-media { transform: scale(1.06); }

        /* Fullscreen modal styles */
        .media-modal-bg { background: rgba(6,8,12,0.94); backdrop-filter: blur(6px); }
        .media-close-btn { background: rgba(255,255,255,0.08); }
        .media-close-btn:hover { background: rgba(255,255,255,0.16); }

        @keyframes zoomFadeIn {
            from { opacity: 0; transform: scale(.92); }
            to { opacity: 1; transform: scale(1); }
        }
        .zoom-enter { animation: zoomFadeIn .28s cubic-bezier(.2,.8,.2,1); }

        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }
        .fade-enter { animation: fadeIn .18s ease-out; }

        .zoom-badge {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            background: rgba(0,0,0,0.25);
            transition: opacity .25s ease;
        }
        .demo-frame:hover .zoom-badge { opacity: 1; }

        /* Evita que o Safari no iOS dê zoom automático ao focar campos com fonte < 16px */
        @media (max-width: 640px) {
            input, select, textarea { font-size: 16px !important; }
        }
    </style>
</head>
<body class="min-h-screen font-body">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_PREFIX = '/api';

        const IconDumbbell = (props) => (<svg className={props.className || "w-6 h-6"} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6.5 6.5h11M6.5 17.5h11M4 9v6m16-6v6M8 4v16m8-4V4"/></svg>);
        const IconPlus = () => (<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>);
        const IconActivity = () => (<svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>);
        const IconTrash = () => (<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>);
        const IconClose = () => (<svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>);
        const IconZoom = () => (<svg className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 104.35 4.35a7.5 7.5 0 0012.3 12.3z M10.5 7.5v6m-3-3h6"/></svg>);

        const Toast = ({ message, type, onClose }) => {
            if (!message) return null;
            const bg = type === 'error' ? 'bg-coral-500/95' : 'bg-lime-500/95';
            const txt = type === 'error' ? 'text-white' : 'text-ink-950';
            return (
                <div className={`fixed top-4 left-4 right-4 sm:left-auto sm:right-4 sm:max-w-sm z-[60] ${bg} ${txt} px-4 py-3 rounded-xl shadow-2xl flex items-center justify-between gap-4 font-medium fade-enter`}>
                    <span className="text-sm">{message}</span>
                    <button onClick={onClose} className="font-bold ml-2 opacity-70 hover:opacity-100">✕</button>
                </div>
            );
        };

        // Utility to convert ids/urls to embeddable sources (handles youtube ids/urls, mp4/webm/ogg, gif/jpg/png)
        function toEmbedUrl(urlOrId) {
            if (!urlOrId) return null;
            const s = String(urlOrId).trim();
            if (!s) return null;
            // plain youtube id (11 chars)
            if (/^[A-Za-z0-9_-]{11}$/.test(s)) return `https://www.youtube.com/embed/${s}`;
            // youtu.be short
            let m = s.match(/(?:youtu\.be\/)([A-Za-z0-9_-]{11})/);
            if (m) return `https://www.youtube.com/embed/${m[1]}`;
            // watch?v=
            m = s.match(/[?&]v=([A-Za-z0-9_-]{11})/);
            if (m) return `https://www.youtube.com/embed/${m[1]}`;
            // embed path present
            if (s.includes('youtube.com/embed')) return s.startsWith('http') ? s : 'https://' + s;
            // direct video files
            if (s.match(/\.(mp4|webm|ogg)(\?|$)/i)) return s.startsWith('http') ? s : 'https://' + s;
            // image / gif
            if (s.match(/\.(gif|jpe?g|png|webp)(\?|$)/i)) return s.startsWith('http') ? s : 'https://' + s;
            // generic http
            if (s.startsWith('http')) return s;
            return null;
        }

        // DemoMedia: renders media inside card and triggers opening fullscreen via onOpen(url, type)
        const DemoMedia = ({ url, onOpen, compact }) => {
            if (!url) return null;
            const embed = toEmbedUrl(url);
            const sizeClass = compact ? "w-full md:w-[26rem] h-52 sm:h-64" : "w-full md:w-[34rem] h-60 sm:h-80";

            if (!embed) {
                const finalUrl = url.startsWith('http') ? url : 'https://' + url;
                return <div className="mt-2 text-xs text-lime-400 underline"><a href={finalUrl} target="_blank" rel="noreferrer">Abrir demonstração ↗</a></div>;
            }
            // YouTube embed — using hqdefault-quality iframe, high-res player
            if (embed.includes('youtube.com/embed')) {
                return (
                    <div className={`mt-2 ${sizeClass} rounded-xl overflow-hidden border border-ink-700 shadow-glow`}>
                        <iframe
                            className="w-full h-full"
                            src={`${embed}?rel=0&modestbranding=1&vq=hd1080`}
                            title="Demonstração"
                            frameBorder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowFullScreen
                        ></iframe>
                    </div>
                );
            }
            // Direct video file
            if (embed.match(/\.(mp4|webm|ogg)(\?|$)/i)) {
                return (
                    <div className={`mt-2 ${sizeClass} rounded-xl overflow-hidden border border-ink-700 shadow-glow bg-black`}>
                        <video controls preload="metadata" className="demo-video">
                            <source src={embed} />
                            Seu navegador não suporta o elemento de vídeo.
                        </video>
                    </div>
                );
            }
            // Image / GIF — rendered at native resolution inside a larger frame, click to zoom full-screen
            if (embed.match(/\.(gif|jpe?g|png|webp)(\?|$)/i)) {
                return (
                    <div
                        className={`demo-frame relative mt-2 ${sizeClass} rounded-xl overflow-hidden border border-ink-700 shadow-glow cursor-zoom-in group`}
                        onClick={() => onOpen && onOpen(embed, 'image')}
                        role="button"
                        tabIndex={0}
                        onKeyDown={(e) => { if (e.key === 'Enter') onOpen && onOpen(embed, 'image') }}
                    >
                        <img src={embed} loading="lazy" decoding="async" alt="Demonstração do exercício" className="demo-media" />
                        <div className="zoom-badge">
                            <div className="w-11 h-11 rounded-full bg-black/50 border border-white/20 flex items-center justify-center text-white">
                                <IconZoom />
                            </div>
                        </div>
                    </div>
                );
            }
            // fallback link
            return (
                <div className="mt-2 text-xs text-lime-400 underline">
                    <a href={embed} target="_blank" rel="noreferrer">Abrir demonstração ↗</a>
                </div>
            );
        };

        function App() {
            const [user, setUser] = useState(null);
            const [toast, setToast] = useState({ message: '', type: 'success' });
            const [fullscreenMedia, setFullscreenMedia] = useState(null); // { url, type }

            // Auth Form State
            const [isLogin, setIsLogin] = useState(true);
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [fullName, setFullName] = useState('');

            // Data State
            const [alunos, setAlunos] = useState([]);
            const [selectedAluno, setSelectedAluno] = useState(null);
            const [treinosAluno, setTreinosAluno] = useState([]);
            const [avaliacoesAluno, setAvaliacoesAluno] = useState([]);

            // Modals
            const [showModalTreino, setShowModalTreino] = useState(false);
            const [showModalMedidas, setShowModalMedidas] = useState(false);

            // Form Treino State
            const [treinoTitulo, setTreinoTitulo] = useState('');
            const [treinoNivel, setTreinoNivel] = useState('Intermediário');
            const [treinoDesc, setTreinoDesc] = useState('');
            const [exercicios, setExercicios] = useState([
                { nome: 'Supino Reto', series: 4, repeticoes: '10-12', carga: '30kg', descanso: '60s', grupo_muscular: 'Peito', observacoes: '', demonstracao_url: '', instrucao_texto: '', matches: [] }
            ]);

            // Form Avaliação State
            const [medidaPeso, setMedidaPeso] = useState('');
            const [medidaAltura, setMedidaAltura] = useState('');
            const [medidaBF, setMedidaBF] = useState('');
            const [medidaCintura, setMedidaCintura] = useState('');
            const [medidaBraco, setMedidaBraco] = useState('');
            const [medidaCoxa, setMedidaCoxa] = useState('');
            const [medidaPeitoral, setMedidaPeitoral] = useState('');

            useEffect(() => {
                const storedToken = localStorage.getItem('token');
                const storedRole = localStorage.getItem('role');
                const storedName = localStorage.getItem('nome');
                const storedId = localStorage.getItem('id');

                if (storedToken && storedRole) {
                    setUser({ token: storedToken, role: storedRole, nome: storedName, id: storedId });
                }
            }, []);

            useEffect(() => {
                if (user && (user.role === 'admin' || user.role === 'personal')) {
                    fetchAlunos();
                } else if (user && user.role === 'aluno') {
                    fetchDadosAluno(user.id);
                }
                // eslint-disable-next-line
            }, [user]);

            useEffect(() => {
                const handleKey = (e) => {
                    if (e.key === 'Escape') setFullscreenMedia(null);
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, []);

            // Trava o scroll do body enquanto o modal de mídia estiver aberto
            useEffect(() => {
                document.body.style.overflow = fullscreenMedia ? 'hidden' : '';
                return () => { document.body.style.overflow = ''; };
            }, [fullscreenMedia]);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast({ message: '', type: 'success' }), 4000);
            };

            const handleOpenMedia = (url, type) => {
                setFullscreenMedia({ url, type });
            };

            const handleAuth = async (e) => {
                e.preventDefault();
                const url = isLogin ? `${API_PREFIX}/login` : `${API_PREFIX}/cadastrar`;
                const body = isLogin
                    ? { username, password }
                    : { nome_completo: fullName, username, password };

                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const data = await res.json();

                    if (res.ok) {
                        if (isLogin) {
                            localStorage.setItem('token', data.token);
                            localStorage.setItem('role', data.role);
                            localStorage.setItem('nome', data.nome);
                            localStorage.setItem('id', data.id);
                            setUser(data);
                            showToast(`Bem-vindo de volta, ${data.nome}!`);
                        } else {
                            showToast('Cadastro realizado! Faça login agora.');
                            setIsLogin(true);
                        }
                    } else {
                        showToast(data.error || 'Ocorreu um erro.', 'error');
                    }
                } catch (err) {
                    showToast('Erro de conexão com o servidor.', 'error');
                }
            };

            const fetchAlunos = async () => {
                try {
                    const res = await fetch(`${API_PREFIX}/alunos`, {
                        headers: { 'Authorization': `Bearer ${user.token}` }
                    });
                    const data = await res.json();
                    if (res.ok) {
                        setAlunos(data);
                        if (data.length > 0 && !selectedAluno) {
                            selectAluno(data[0]);
                        }
                    }
                } catch (err) {
                    console.error(err);
                }
            };

            const selectAluno = (aluno) => {
                setSelectedAluno(aluno);
                fetchDadosAluno(aluno.id);
            };

            const fetchDadosAluno = async (alunoId) => {
                try {
                    const [resTreinos, resMedidas] = await Promise.all([
                        fetch(`${API_PREFIX}/treinos/aluno/${alunoId}`, { headers: { 'Authorization': `Bearer ${user.token}` } }),
                        fetch(`${API_PREFIX}/avaliacoes/aluno/${alunoId}`, { headers: { 'Authorization': `Bearer ${user.token}` } })
                    ]);

                    const treinos = await resTreinos.json();
                    const avaliacoes = await resMedidas.json();

                    if (resTreinos.ok) setTreinosAluno(treinos);
                    if (resMedidas.ok) setAvaliacoesAluno(avaliacoes);
                } catch (err) {
                    console.error(err);
                }
            };

            const handleAddExercicio = () => {
                setExercicios([...exercicios, { nome: '', series: 4, repeticoes: '10', carga: '0kg', descanso: '60s', grupo_muscular: 'Geral', observacoes: '', demonstracao_url: '', instrucao_texto: '', matches: [] }]);
            };

            const handleRemoveExercicio = (index) => {
                setExercicios(exercicios.filter((_, i) => i !== index));
            };

            // Busca demonstrações no dataset pelo nome do exercício
            const handleFetchDemoForExercise = async (index) => {
                const ex = exercicios[index];
                if (!ex || !ex.nome || ex.nome.trim().length === 0) {
                    return showToast('Digite o nome do exercício antes de buscar.', 'error');
                }
                try {
                    const res = await fetch(`${API_PREFIX}/exercicios/search?name=${encodeURIComponent(ex.nome)}&limit=8`, {
                        headers: { 'Authorization': `Bearer ${user.token}` }
                    });
                    const data = await res.json();
                    if (res.ok) {
                        const matches = data.matches || [];
                        setExercicios(prev => {
                            const copy = [...prev];
                            copy[index] = { ...copy[index] };
                            if (matches.length === 1 && matches[0].url) {
                                copy[index].demonstracao_url = matches[0].url;
                                copy[index].matches = [];
                            } else {
                                copy[index].matches = matches;
                            }
                            return copy;
                        });
                        if (matches.length === 0) showToast('Nenhuma demonstração encontrada para esse nome.', 'error');
                        else if (matches.length === 1 && matches[0].url) showToast('Demonstração encontrada e aplicada automaticamente!');
                        else showToast('Foram encontradas opções — escolha a correta abaixo.');
                    } else {
                        showToast(data.error || 'Erro ao buscar demonstração.', 'error');
                    }
                } catch (err) {
                    showToast('Erro ao buscar demonstração.', 'error');
                }
            };

            const applyMatchToExercise = (exIndex, match) => {
                setExercicios(prev => {
                    const copy = [...prev];
                    copy[exIndex] = { ...copy[exIndex], demonstracao_url: match.url || '', matches: [] };
                    return copy;
                });
                showToast('Demonstração aplicada ao exercício!');
            };

            const handleSaveTreino = async (e) => {
                e.preventDefault();
                if (!selectedAluno) return showToast('Selecione um aluno primeiro.', 'error');

                try {
                    const res = await fetch(`${API_PREFIX}/treinos`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${user.token}`
                        },
                        body: JSON.stringify({
                            aluno_id: selectedAluno.id,
                            titulo: treinoTitulo,
                            nivel: treinoNivel,
                            descricao: treinoDesc,
                            exercicios: exercicios.map(ex => ({
                                nome: ex.nome,
                                series: ex.series,
                                repeticoes: ex.repeticoes,
                                carga: ex.carga,
                                descanso: ex.descanso,
                                grupo_muscular: ex.grupo_muscular,
                                observacoes: ex.observacoes,
                                demonstracao_url: ex.demonstracao_url,
                                instrucao_texto: ex.instrucao_texto
                            }))
                        })
                    });

                    const data = await res.json();
                    if (res.ok) {
                        showToast('Treino cadastrado com sucesso!');
                        setShowModalTreino(false);
                        setTreinoTitulo('');
                        setTreinoDesc('');
                        setExercicios([{ nome: 'Supino Reto', series: 4, repeticoes: '10-12', carga: '30kg', descanso: '60s', grupo_muscular: 'Peito', observacoes: '', demonstracao_url: '', instrucao_texto: '', matches: [] }]);
                        fetchDadosAluno(selectedAluno.id);
                    } else {
                        showToast(data.error || 'Erro ao salvar treino.', 'error');
                    }
                } catch (err) {
                    showToast('Erro ao salvar treino.', 'error');
                }
            };

            const handleSaveMedidas = async (e) => {
                e.preventDefault();
                if (!selectedAluno) return showToast('Selecione um aluno primeiro.', 'error');

                try {
                    const res = await fetch(`${API_PREFIX}/avaliacoes`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${user.token}`
                        },
                        body: JSON.stringify({
                            aluno_id: selectedAluno.id,
                            peso: parseFloat(medidaPeso),
                            altura: parseFloat(medidaAltura),
                            bf: parseFloat(medidaBF) || null,
                            cintura: parseFloat(medidaCintura) || null,
                            braco: parseFloat(medidaBraco) || null,
                            coxa: parseFloat(medidaCoxa) || null,
                            peitoral: parseFloat(medidaPeitoral) || null
                        })
                    });

                    const data = await res.json();
                    if (res.ok) {
                        showToast(`Avaliação física registrada! IMC: ${data.imc}`);
                        setShowModalMedidas(false);
                        setMedidaPeso(''); setMedidaAltura(''); setMedidaBF('');
                        setMedidaCintura(''); setMedidaBraco(''); setMedidaCoxa(''); setMedidaPeitoral('');
                        fetchDadosAluno(selectedAluno.id);
                    } else {
                        showToast(data.error || 'Erro ao registrar avaliação.', 'error');
                    }
                } catch (err) {
                    showToast('Erro ao registrar avaliação.', 'error');
                }
            };

            const handleDeleteTreino = async (id) => {
                try {
                    const res = await fetch(`${API_PREFIX}/treinos/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${user.token}` }
                    });
                    if (res.ok) {
                        showToast('Treino removido com sucesso.');
                        fetchDadosAluno(selectedAluno ? selectedAluno.id : user.id);
                    }
                } catch (err) {
                    showToast('Erro ao remover treino.', 'error');
                }
            };

            const handleToggleExercio = async (exId) => {
                try {
                    const res = await fetch(`${API_PREFIX}/exercicios/${exId}/toggle`, {
                        method: 'PUT',
                        headers: { 'Authorization': `Bearer ${user.token}` }
                    });
                    if (res.ok) {
                        fetchDadosAluno(selectedAluno ? selectedAluno.id : user.id);
                    }
                } catch (err) {
                    console.error(err);
                }
            };

            const handleLogout = () => {
                localStorage.clear();
                setUser(null);
            };

            if (!user) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <Toast message={toast.message} type={toast.type} onClose={() => setToast({ message: '' })} />
                        <div className="w-full max-w-md bg-ink-900 border border-ink-700 rounded-2xl p-6 sm:p-8 shadow-2xl">
                            <div className="flex justify-center mb-6">
                                <div className="w-14 h-14 bg-lime-500 rounded-2xl flex items-center justify-center text-ink-950 shadow-glow">
                                    <IconDumbbell />
                                </div>
                            </div>
                            <h1 className="font-display text-3xl font-bold text-center text-white mb-1 tracking-tight">FitPro</h1>
                            <p className="text-ink-600 text-center text-sm mb-6">Sua evolução física sob controle</p>

                            <form onSubmit={handleAuth} className="space-y-4">
                                {!isLogin && (
                                    <div>
                                        <label className="text-xs font-medium text-slate-400">Nome Completo</label>
                                        <input
                                            type="text"
                                            required
                                            value={fullName}
                                            onChange={(e) => setFullName(e.target.value)}
                                            className="w-full mt-1 bg-ink-800 border border-ink-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-lime-500 transition-colors"
                                            placeholder="Ex: Carlos Silva"
                                        />
                                    </div>

                                                            onChange={(e) => {
                                                                const copy = [...exercicios];
                                                                copy[idx] = { ...copy[idx], grupo_muscular: e.target.value };
                                                                setExercicios(copy);
                                                            }}
                                                            className="flex-1 bg-ink-800 border border-ink-700 rounded-lg p-2 text-white text-xs focus:outline-none focus:border-lime-500"
                                                        />
                                                        <button
                                                            type="button"
                                                            onClick={() => handleFetchDemoForExercise(idx)}
                                                            className="px-3 text-xs bg-lime-500 hover:bg-lime-400 rounded-lg text-ink-950 font-semibold whitespace-nowrap"
                                                        >
                                                            Buscar Demo
                                                        </button>
                                                    </div>
                                                </div>
                                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                                    <input
                                                        type="number"
                                                        placeholder="Séries"
                                                        value={ex.series}
                                                        onChange={(e) => {
                                                            const copy = [...exercicios];
                                                            copy[idx] = { ...copy[idx], series: e.target.value };
                                                            setExercicios(copy);
                                                        }}
                                                        className="bg-ink-800 border border-ink-700 rounded-lg p-2 text-white text-xs text-center focus:outline-none focus:border-lime-500"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="Reps (10-12)"
                                                        value={ex.repeticoes}
                                                        onChange={(e) => {
                                                            const copy = [...exercicios];
                                                            copy[idx] = { ...copy[idx], repeticoes: e.target.value };
                                                            setExercicios(copy);
                                                        }}
                                                        className="bg-ink-800 border border-ink-700 rounded-lg p-2 text-white text-xs text-center focus:outline-none focus:border-lime-500"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="Carga (30kg)"
                                                        value={ex.carga}
                                                        onChange={(e) => {
                                                            const copy = [...exercicios];
                                                            copy[idx] = { ...copy[idx], carga: e.target.value };
                                                            setExercicios(copy);
                                                        }}
                                                        className="bg-ink-800 border border-ink-700 rounded-lg p-2 text-white text-xs text-center focus:outline-none focus:border-lime-500"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="Descanso (60s)"
                                                        value={ex.descanso}
                                                        onChange={(e) => {
                                                            const copy = [...exercicios];
                                                            copy[idx] = { ...copy[idx], descanso: e.target.value };
                                                            setExercicios(copy);
                                                        }}
                                                        className="bg-ink-800 border border-ink-700 rounded-lg p-2 text-white text-xs text-center focus:outline-none focus:border-lime-500"
                                                    />
                                                </div>

                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                    <input
                                                        type="text"
                                                        placeholder="URL da demonstração (YouTube ou link direto .mp4/.gif) — ou deixe em branco para buscar"
                                                        value={ex.demonstracao_url}
                                                        onChange={(e) => {
                                                            const copy = [...exercicios];
                                                            copy[idx] = { ...copy[idx], demonstracao_url: e.target.value };
                                                            setExercicios(copy);
                                                        }}
                                                        className="bg-ink-800 border border-ink-700 rounded-lg p-2 text-white text-xs focus:outline-none focus:border-lime-500"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="Instrução rápida (ex: 'manter o tronco ereto')"
                                                        value={ex.instrucao_texto}
                                                        onChange={(e) => {
                                                            const copy = [...exercicios];
                                                            copy[idx] = { ...copy[idx], instrucao_texto: e.target.value };
                                                            setExercicios(copy);
                                                        }}
                                                        className="bg-ink-800 border border-ink-700 rounded-lg p-2 text-white text-xs focus:outline-none focus:border-lime-500"
                                                    />
                                                </div>

                                                {/* Live preview do exercício, já com o mesmo componente de zoom */}
                                                {ex.demonstracao_url && (
                                                    <DemoMedia url={ex.demonstracao_url} onOpen={handleOpenMedia} compact />
                                                )}

                                                <div>
                                                    <label className="text-xs text-slate-400">Observações (opcional)</label>
                                                    <input
                                                        type="text"
                                                        placeholder="Observações específicas"
                                                        value={ex.observacoes}
                                                        onChange={(e) => {
                                                            const copy = [...exercicios];
                                                            copy[idx] = { ...copy[idx], observacoes: e.target.value };
                                                            setExercicios(copy);
                                                        }}
                                                        className="w-full mt-1 bg-ink-800 border border-ink-700 rounded-lg p-2 text-white text-xs focus:outline-none focus:border-lime-500"
                                                    />
                                                </div>

                                                {/* If matches exist, show selection area */}
                                                {ex.matches && ex.matches.length > 0 && (
                                                    <div className="bg-ink-900 p-3 rounded-lg border border-ink-700">
                                                        <div className="flex items-center justify-between mb-2">
                                                            <div className="text-xs text-slate-300 font-medium">Opções de demonstração encontradas:</div>
                                                            <div className="text-xs text-slate-500">Clique para aplicar</div>
                                                        </div>
                                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                            {ex.matches.map((m, i) => (
                                                                <button
                                                                    key={i}
                                                                    type="button"
                                                                    onClick={() => applyMatchToExercise(idx, m)}
                                                                    className="text-left p-2 bg-ink-800 rounded-lg hover:bg-ink-700 text-xs border border-ink-700 flex items-center gap-3 transition-colors"
                                                                >
                                                                    <div className="flex-1">
                                                                        <div className="font-semibold text-slate-200 truncate">{m.name}</div>
                                                                        <div className="text-slate-500 text-xs truncate">{m.url || 'sem url'}</div>
                                                                    </div>
                                                                    <div className="text-lime-400 text-xs font-medium">Usar</div>
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>

                                    <div className="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 pt-4">
                                        <button
                                            type="button"
                                            onClick={() => setShowModalTreino(false)}
                                            className="w-full sm:w-auto px-4 py-2 bg-ink-800 text-slate-300 rounded-xl text-sm font-medium border border-ink-700"
                                        >
                                            Cancelar
                                        </button>
                                        <button
                                            type="submit"
                                            className="w-full sm:w-auto px-4 py-2 bg-lime-500 hover:bg-lime-400 text-ink-950 rounded-xl text-sm font-bold shadow-glow"
                                        >
                                            Salvar Treino
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Nova Avaliação */}
                    {showModalMedidas && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-2 sm:p-4 overflow-y-auto fade-enter">
                            <div className="bg-ink-900 border border-ink-700 rounded-2xl max-w-lg w-full p-4 sm:p-6 space-y-4 zoom-enter">
                                <h3 className="font-display text-xl font-bold text-white">Nova Avaliação Física para {selectedAluno?.nome_completo}</h3>
                                <form onSubmit={handleSaveMedidas} className="space-y-4">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs font-medium text-slate-400">Peso (kg)</label>
                                            <input
                                                type="number" step="0.1" required
                                                placeholder="75.5"
                                                value={medidaPeso}
                                                onChange={(e) => setMedidaPeso(e.target.value)}
                                                className="w-full mt-1 bg-ink-800 border border-ink-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-lime-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs font-medium text-slate-400">Altura (metros)</label>
                                            <input
                                                type="number" step="0.01" required
                                                placeholder="1.75"
                                                value={medidaAltura}
                                                onChange={(e) => setMedidaAltura(e.target.value)}
                                                className="w-full mt-1 bg-ink-800 border border-ink-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-lime-500"
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <div>
                                            <label className="text-xs font-medium text-slate-400">% Gordura Corporal (BF)</label>
                                            <input
                                                type="number" step="0.1"
                                                placeholder="15.0"
                                                value={medidaBF}
                                                onChange={(e) => setMedidaBF(e.target.value)}
                                                className="w-full mt-1 bg-ink-800 border border-ink-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-lime-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs font-medium text-slate-400">Cintura (cm)</label>
                                            <input
                                                type="number" step="0.1"
                                                placeholder="80"
                                                value={medidaCintura}
                                                onChange={(e) => setMedidaCintura(e.target.value)}
                                                className="w-full mt-1 bg-ink-800 border border-ink-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-lime-500"
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-3 gap-2 sm:gap-3">
                                        <div>
                                            <label className="text-xs font-medium text-slate-400">Braço (cm)</label>
                                            <input
                                                type="number" step="0.1"
                                                placeholder="38"
                                                value={medidaBraco}
                                                onChange={(e) => setMedidaBraco(e.target.value)}
                                                className="w-full mt-1 bg-ink-800 border border-ink-700 rounded-xl p-2.5 text-white text-sm focus:outline-none focus:border-lime-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs font-medium text-slate-400">Coxa (cm)</label>
                                            <input
                                                type="number" step="0.1"
                                                placeholder="58"
                                                value={medidaCoxa}
                                                onChange={(e) => setMedidaCoxa(e.target.value)}
                                                className="w-full mt-1 bg-ink-800 border border-ink-700 rounded-xl p-2.5 text-white text-sm focus:outline-none focus:border-lime-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs font-medium text-slate-400">Peitoral (cm)</label>
                                            <input
                                                type="number" step="0.1"
                                                placeholder="102"
                                                value={medidaPeitoral}
                                                onChange={(e) => setMedidaPeitoral(e.target.value)}
                                                className="w-full mt-1 bg-ink-800 border border-ink-700 rounded-xl p-2.5 text-white text-sm focus:outline-none focus:border-lime-500"
                                            />
                                        </div>
                                    </div>

                                    <div className="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 pt-4">
                                        <button
                                            type="button"
                                            onClick={() => setShowModalMedidas(false)}
                                            className="w-full sm:w-auto px-4 py-2 bg-ink-800 text-slate-300 rounded-xl text-sm font-medium border border-ink-700"
                                        >
                                            Cancelar
                                        </button>
                                        <button
                                            type="submit"
                                            className="w-full sm:w-auto px-4 py-2 bg-lime-500 hover:bg-lime-400 text-ink-950 rounded-xl text-sm font-bold shadow-glow"
                                        >
                                            Registrar Avaliação
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
