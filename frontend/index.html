<!-- index.html -->
<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitPro — Gestão de Treinos & Evolução</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS pré-compilado (build estático, sem JIT em runtime) -->
    <link rel="stylesheet" href="tailwind.css" />

    <!-- React e ReactDOM (builds de produção, locais, sem CDN externo) -->
    <script src="react.production.min.js"></script>
    <script src="react-dom.production.min.js"></script>
    <style>
      body {
        background-color: #0a0e14;
        background-image:
          radial-gradient(
            circle at 15% 0%,
            rgba(200, 241, 105, 0.06),
            transparent 40%
          ),
          radial-gradient(
            circle at 85% 15%,
            rgba(255, 107, 74, 0.05),
            transparent 35%
          );
        color: #e7ebf1;
        font-family: "Inter", system-ui, sans-serif;
      }
      .font-display {
        font-family: "Space Grotesk", sans-serif;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #3a4553;
        border-radius: 8px;
      }

      img.demo-media,
      video.demo-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        image-rendering: auto;
        display: block;
        transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .demo-frame:hover img.demo-media {
        transform: scale(1.06);
      }

      /* Estilos do modal de tela cheia */
      .media-modal-bg {
        background: rgba(6, 8, 12, 0.94);
        backdrop-filter: blur(6px);
      }
      .media-close-btn {
        background: rgba(255, 255, 255, 0.08);
      }
      .media-close-btn:hover {
        background: rgba(255, 255, 255, 0.16);
      }

      @keyframes zoomFadeIn {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .zoom-enter {
        animation: zoomFadeIn 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .fade-enter {
        animation: fadeIn 0.18s ease-out;
      }

      .zoom-badge {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        background: rgba(0, 0, 0, 0.25);
        transition: opacity 0.25s ease;
      }
      .demo-frame:hover .zoom-badge {
        opacity: 1;
      }

      /* Evita que o Safari no iOS dê zoom automático ao focar campos com fonte < 16px */
      @media (max-width: 640px) {
        input,
        select,
        textarea {
          font-size: 16px !important;
        }
      }
    </style>
  </head>
  <body class="min-h-screen font-body">
    <div id="root"></div>

    <!-- JSX já transpilado em tempo de build (Babel CLI), sem compilação em runtime -->
    <script src="app.js"></script>
  </body>
</html>
